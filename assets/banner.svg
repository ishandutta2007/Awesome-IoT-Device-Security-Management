<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a11"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#0000eb"/>
    </linearGradient>

    <!-- Shield Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #38bdf8; letter-spacing: 1px; }
    .tagline { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 15px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #00f2fe; }

    /* Keyframe Animations */
    @keyframes pulseRing {
      0% { r: 40px; opacity: 0.8; stroke-width: 2px; }
      50% { r: 80px; opacity: 0.3; stroke-width: 1px; }
      100% { r: 120px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(300px); opacity: 0.2; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes nodePulse {
      0%, 100% { fill: #00f2fe; filter: drop-shadow(0 0 2px #00f2fe); }
      50% { fill: #38bdf8; filter: drop-shadow(0 0 8px #38bdf8); }
    }

    .pulsing-ring { animation: pulseRing 3s infinite ease-out; transform-origin: 1020px 170px; }
    .scan-element { animation: scanLine 4s infinite linear; }
    .floating-particle { animation: floatParticle 6s infinite ease-in-out; }
    .tech-node { animation: nodePulse 2.5s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/>

  <!-- Decorative Network Grid / Lines (Background Layer) -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="170" x2="1200" y2="170"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="500" y1="0" x2="500" y2="340"/>
    <line x1="800" y1="0" x2="800" y2="340"/>
    <line x1="1020" y1="0" x2="1020" y2="340"/>
  </g>

  <!-- Dynamic Animated Scanline (Background Layer) -->
  <line x1="0" y1="20" x2="1200" y2="20" stroke="#00f2fe" stroke-width="2" class="scan-element" opacity="0.4"/>

  <!-- Background Floating Tech Nodes -->
  <g class="floating-particle">
    <circle cx="120" cy="60" r="4" class="tech-node"/>
    <circle cx="280" cy="280" r="3" fill="#38bdf8" opacity="0.6"/>
    <circle cx="750" cy="50" r="5" fill="#4facfe" opacity="0.5"/>
    <circle cx="650" cy="290" r="4" class="tech-node"/>
    <line x1="120" y1="60" x2="200" y2="120" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  </g>

  <!-- Dynamic Radar / Shield Visual Anchor (Right Side) -->
  <g transform="translate(1020, 170)">
    <!-- Animated Pulsing Concentric Rings -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00f2fe" class="pulsing-ring"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#38bdf8" stroke-dasharray="6,6" opacity="0.4"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#1e3a8a" opacity="0.5"/>
    
    <!-- Shield Icon Core -->
    <path d="M-35,-45 L35,-45 L45,15 C45,55 0,80 0,80 C0,80 -45,55 -45,15 Z" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)"/>
    
    <!-- Lock / IoT Symbol inside Shield -->
    <path d="M-12,-5 L12,-5 L12,20 L-12,20 Z M-7,-5 L-7,-14 C-7,-20 7,-20 7,-14 L7,-5" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="7" r="3" fill="#00f2fe"/>
  </g>

  <!-- Content Container (Foreground Layer - Guaranteed High Visibility) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 50)">
      <rect width="260" height="32" rx="16" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5" opacity="0.9"/>
      <circle cx="20" cy="16" r="5" fill="#00f2fe" class="tech-node"/>
      <text x="36" y="21" class="badge-text">🛡️ ENTERPRISE &amp; EMBEDDED SECURITY</text>
    </g>

    <!-- Main Repository Title -->
    <text x="0" y="130" class="title">Awesome IoT Device Security</text>
    <text x="0" y="172" class="title" fill="url(#accentGrad)">&amp; Management Ecosystem</text>

    <!-- Subtitle & Description -->
    <text x="0" y="220" class="subtitle">🔒 Discover • Firmware Analysis • Vulnerability Management • Zero Trust</text>
    <text x="0" y="255" class="tagline">Curated SaaS Platforms, Industrial OT Defense &amp; Open-Source Security Tools</text>

    <!-- Accent Line -->
    <rect x="0" y="280" width="480" height="4" rx="2" fill="url(#accentGrad)"/>
  </g>
</svg>
